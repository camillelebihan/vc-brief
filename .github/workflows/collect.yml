name: Collect feeds

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (off the hour to avoid queue delays)
    - cron: '52 6 * * *'     # 07:52 Paris (winter time): fresh pull just before the 8:00 edition, after the 7:30 newsletters
  workflow_dispatch: {}       # run by hand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
